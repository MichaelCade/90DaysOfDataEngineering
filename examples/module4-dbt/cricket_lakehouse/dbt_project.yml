name: cricket_lakehouse
version: '1.0.0'
config-version: 2

# The profile in profiles.yml that tells dbt how to reach Trino (the lakehouse catalog).
profile: cricket_lakehouse

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  cricket_lakehouse:
    # staging = light cleaning/renaming, one model per source. Cheap to rebuild, so views.
    staging:
      +materialized: view
    # marts = the metrics people actually query. Materialised as real Iceberg tables in MinIO.
    marts:
      +materialized: table
      # Iceberg supports CREATE OR REPLACE TABLE — simplest idempotent rebuild on this catalog.
      +on_table_exists: replace
