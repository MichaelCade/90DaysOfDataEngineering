# dbt_utils gives us battle-tested generic tests (accepted_range,
# unique_combination_of_columns) so we don't hand-roll them. `dbt deps` installs it.
packages:
  - package: dbt-labs/dbt_utils
    version: [">=1.1.0", "<2.0.0"]
  # dbt-expectations: Great-Expectations-style assertions (distributions, ranges, regex)
  # beyond dbt_utils — used by the marts' extended tests (Day 46).
  - package: metaplane/dbt_expectations
    version: [">=0.10.0", "<0.11.0"]
