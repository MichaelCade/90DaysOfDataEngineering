version: 2

models:
  - name: batting_summary
    description: Batting metrics, built locally on DuckDB — mirrors the Trino mart.
    columns:
      - name: player
        data_tests: [not_null, unique]
      - name: conversion_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments: { min_value: 0, max_value: 100 }
