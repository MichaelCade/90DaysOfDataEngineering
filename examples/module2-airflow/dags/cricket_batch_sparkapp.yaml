# SparkApplication submitted by the spark_cricket_batch Airflow DAG (SparkKubernetesOperator).
# Git-synced (public), so NO inline secrets: MinIO creds come from the `minio-creds` Secret in ns
# spark via AWS_* env vars (Iceberg S3FileIO uses the default AWS credential chain). The PySpark
# code is fetched over HTTPS from the repo (mainApplicationFile) — no image bake, no ConfigMap.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: cricket-batch-airflow
  namespace: spark
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: apache/spark:3.5.3
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "https://raw.githubusercontent.com/MichaelCade/90DaysOfDataEngineering/main/examples/module6-spark/jobs/cricket_batch.py"
  sparkVersion: "3.5.3"
  deps:
    packages:
      - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1
      - org.apache.iceberg:iceberg-aws-bundle:1.6.1
  sparkConf:
    spark.jars.ivy: "/tmp/.ivy2"
    spark.sql.extensions: "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    spark.sql.catalog.lakehouse: "org.apache.iceberg.spark.SparkCatalog"
    spark.sql.catalog.lakehouse.type: "rest"
    spark.sql.catalog.lakehouse.uri: "http://lakekeeper.lakehouse.svc.cluster.local:8181/catalog"
    spark.sql.catalog.lakehouse.warehouse: "lakehouse"
    spark.sql.catalog.lakehouse.io-impl: "org.apache.iceberg.aws.s3.S3FileIO"
    spark.sql.catalog.lakehouse.s3.endpoint: "http://minio.minio.svc.cluster.local:9000"
    spark.sql.catalog.lakehouse.s3.path-style-access: "true"
    spark.sql.defaultCatalog: "lakehouse"
    # NOTE: no s3.access-key-id/secret here — S3FileIO reads AWS_* env (from the Secret) instead.
  driver:
    cores: 1
    memory: "1g"
    serviceAccount: spark-operator-spark
    env:
      - { name: AWS_REGION, value: "us-east-1" }
    envFrom:
      - secretRef: { name: minio-creds }
  executor:
    instances: 1
    cores: 1
    memory: "1g"
    env:
      - { name: AWS_REGION, value: "us-east-1" }
    envFrom:
      - secretRef: { name: minio-creds }
